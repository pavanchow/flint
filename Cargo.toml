[package]
name = "flint"
version = "0.1.0"
edition = "2021"
description = "An embedded, single-binary key-value store: a persistent append-only log with an in-memory index. The SQLite of key-value stores."

[dependencies]
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
